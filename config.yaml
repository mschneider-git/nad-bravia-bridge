name: "NAD/Bravia Remote Bridge"
version: "2.0.1"
slug: "nadbridge"
description: "Relays a Bluetooth-paired TV remote to a NAD amplifier (volume/mute) and a Sony Bravia TV (everything else) over the network"
image: "ghcr.io/mschneider-git/nadbridge-{arch}"
arch:
  - aarch64
  - amd64
init: false
host_dbus: true
startup: services
boot: auto
options:
  remote_mac: "AA:BB:CC:DD:EE:FF"
  nad_host: "192.168.1.50"
  nad_port: 30001
  tv_host: "192.168.1.51"
  tv_psk: "0000"
schema:
  remote_mac: "str"
  nad_host: "str"
  nad_port: "port"
  tv_host: "str"
  tv_psk: "password"
